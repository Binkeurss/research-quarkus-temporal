quarkus.http.port=8080
quarkus.application.name=quarkus-app

%dev.quarkus.log.level=DEBUG
%prod.quarkus.log.level=INFO

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}

%dev.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.hibernate-orm.log.sql=true

# Temporal core
temporal.target=${TEMPORAL_TARGET:localhost:7233}
temporal.namespace=${TEMPORAL_NAMESPACE:default}

# Temporal workers
temporal.workers.product.enabled=${TEMPORAL_PRODUCT_WORKER_ENABLED:true}
temporal.workers.product.task-queue=${TEMPORAL_PRODUCT_TASK_QUEUE:PRODUCT_TASK_QUEUE}
temporal.workers.product.max-concurrent-workflow-tasks=${TEMPORAL_PRODUCT_MAX_CONCURRENT_WORKFLOW_TASKS:3}
temporal.workers.product.max-concurrent-activities=${TEMPORAL_PRODUCT_MAX_CONCURRENT_ACTIVITIES:3}
temporal.workers.product.workflow-task-pollers=${TEMPORAL_PRODUCT_WORKFLOW_TASK_POLLERS:2}
temporal.workers.product.activity-task-pollers=${TEMPORAL_PRODUCT_ACTIVITY_TASK_POLLERS:2}

temporal.workers.order.enabled=${TEMPORAL_ORDER_WORKER_ENABLED:false}
temporal.workers.order.task-queue=${TEMPORAL_ORDER_TASK_QUEUE:ORDER_TASK_QUEUE}

temporal.workers.email.enabled=${TEMPORAL_EMAIL_WORKER_ENABLED:false}
temporal.workers.email.task-queue=${TEMPORAL_EMAIL_TASK_QUEUE:EMAIL_TASK_QUEUE}

# Product publication workflow delays
product.publication.review-delay-seconds=${PRODUCT_PUBLICATION_REVIEW_DELAY_SECONDS:15}
product.publication.processing-delay-seconds=${PRODUCT_PUBLICATION_PROCESSING_DELAY_SECONDS:20}
product.publication.workflow-timeout-seconds=${PRODUCT_PUBLICATION_WORKFLOW_TIMEOUT_SECONDS:300}
